comment:
  layout: "diff, files, components"
  behavior: default
  require_changes: false

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
  individual_components:
    - component_id: frontend_components
      name: src/components
      paths:
        - src/components/**

    - component_id: frontend_dal
      name: src/dal
      paths:
        - src/dal/**

    - component_id: frontend_interfaces
      name: src/interfaces
      paths:
        - src/interfaces/**

    - component_id: frontend_utilities
      name: src/utilities
      paths:
        - src/utilities/**

coverage:
  status:
    project:
      default:
        target: auto
      frontend:
        target: auto
        paths:
          - src/**
    patch:
      default:
        target: auto
